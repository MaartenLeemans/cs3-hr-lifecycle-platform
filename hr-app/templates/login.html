<!DOCTYPE html>
<html>
<head>
    <title>HR Login</title>
</head>
<body>

<h1>HR Lifecycle Platform Login</h1>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST" action="/login">
    <input type="text" name="username" placeholder="AD username" required>
    <br><br>
    <input type="password" name="password" placeholder="AD password" required>
    <br><br>
    <button type="submit">Login</button>
</form>

</body>
</html>
